name: Publish Home Lighting Manager Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/home_lighting_manager/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("custom_components/home_lighting_manager/manifest.json").read_text())
          print(data["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tagcheck
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.tagcheck.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}"             --target "${{ github.sha }}"             --title "Home Lighting Manager ${{ steps.version.outputs.tag }}"             --generate-notes
