- id: '1784224203901'
  alias: Liquor Cabinet Display Lighting
  description: >-
    Notify the cabinet-scoped executor of current truth. The executor fences stale
    work, preserves canonical Manual intent and never recalls a whole Main Area scene.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.liquor_cabinet_l_door
    - binary_sensor.liquor_cabinet_door_r
    to: null
    id: door_state
  - trigger: state
    entity_id: binary_sensor.hue_bridge_living_room
    to: null
    id: sync_changed
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: sensor.home_lighting_manager_shadow_health
    attribute: effective_ownership
    id: ownership_changed
  - trigger: state
    entity_id: sensor.home_lighting_manager_shadow_health
    attribute: pending_intent_entities
    id: ownership_changed
  - trigger: state
    entity_id:
    - input_boolean.home_lighting_main_area_window
    - input_boolean.home_lighting_holiday_active
    - input_text.home_lighting_holiday_key
    - sensor.nfl_san_francisco_49ers
    to: null
    id: ownership_changed
  - trigger: state
    entity_id: light.living_room_liquor_cabinet_light
    from: unavailable
    to: null
    id: recovery
  - trigger: state
    entity_id: light.living_room_liquor_cabinet_light
    from: unknown
    to: null
    id: recovery
  conditions: []
  actions:
  - action: home_lighting_reconciliation.cabinet
    response_variable: cabinet_result
    data:
      reason: "{{ trigger.id if trigger.id in ['door_state', 'sync_changed', 'startup', 'ownership_changed', 'recovery'] else 'door_state' }}"
  mode: parallel
  max: 20
