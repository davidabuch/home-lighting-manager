# Manual assertion restarts and stops the gauge before further light commands.
- id: '1784335455692'
  alias: Spa Gauge - Temperature Color
  description: |
    Displays spa water temperature using Palette 4 after the Session Manager has captured the strip's pre-session state. The strip pulses while the spa heater is actively heating below the selected target temperature. At target temperature, it blinks five times once per spa session and then remains solid. If the spa later cools and the heater restarts, pulsing resumes without repeating the target-reached blink. Turning off the gauge immediately stops this automation so the Session Manager can restore the original strip state.
  triggers:
  - trigger: state
    entity_id: climate.poolos_native_intellicenter_hot_tub_thermostat
    id: climate_state_changed
  - trigger: state
    entity_id: climate.poolos_native_intellicenter_hot_tub_thermostat
    attribute: current_temperature
    id: temperature_changed
  - trigger: state
    entity_id: climate.poolos_native_intellicenter_hot_tub_thermostat
    attribute: temperature
    id: target_changed
  - trigger: state
    entity_id: climate.poolos_native_intellicenter_hot_tub_thermostat
    attribute: hvac_action
    id: heater_action_changed
  - trigger: state
    entity_id: input_boolean.spa_gauge_active
    id: gauge_active_changed
  - trigger: state
    entity_id: binary_sensor.hue_bridge_backyard
    id: backyard_sync_changed
  - trigger: state
    entity_id: input_boolean.home_lighting_manual_backyard
    id: manual_changed
  actions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.spa_gauge_active
      state: 'on'
    - condition: state
      entity_id: binary_sensor.hue_bridge_backyard
      state: 'off'
    - condition: state
      entity_id: input_boolean.home_lighting_manual_backyard
      state: 'off'
  - variables:
      current_temp: |
        {{
          state_attr(
            'climate.poolos_native_intellicenter_hot_tub_thermostat',
            'current_temperature'
          ) | float(80)
        }}
      target_temp: |
        {{
          state_attr(
            'climate.poolos_native_intellicenter_hot_tub_thermostat',
            'temperature'
          ) | float(100)
        }}
      spa_enabled: |
        {{
          states('climate.poolos_native_intellicenter_hot_tub_thermostat') == 'heat'
        }}
      heater_active: |
        {{
          state_attr(
            'climate.poolos_native_intellicenter_hot_tub_thermostat',
            'hvac_action'
          ) == 'heating'
        }}
      target_reached: |
        {{
          current_temp | float >= target_temp | float
        }}
      palette_temp: |
        {% set whole = current_temp | int %} {{ [80, [whole, 102] | min] | max }}
      xy_palette:
        '80':
        - 0.153
        - 0.048
        '81':
        - 0.151
        - 0.061
        '82':
        - 0.149
        - 0.078
        '83':
        - 0.147
        - 0.098
        '84':
        - 0.145
        - 0.122
        '85':
        - 0.147
        - 0.15
        '86':
        - 0.151
        - 0.183
        '87':
        - 0.158
        - 0.22
        '88':
        - 0.173
        - 0.26
        '89':
        - 0.198
        - 0.305
        '90':
        - 0.235
        - 0.35
        '91':
        - 0.3
        - 0.415
        '92':
        - 0.385
        - 0.47
        '93':
        - 0.455
        - 0.49
        '94':
        - 0.505
        - 0.47
        '95':
        - 0.55
        - 0.43
        '96':
        - 0.59
        - 0.39
        '97':
        - 0.625
        - 0.355
        '98':
        - 0.65
        - 0.33
        '99':
        - 0.675
        - 0.31
        '100':
        - 0.69
        - 0.3
        '101':
        - 0.47
        - 0.205
        '102':
        - 0.3
        - 0.15
      selected_xy: |
        {{ xy_palette[palette_temp | int | string] }}
      gauge_x: |
        {{ selected_xy[0] | float }}
      gauge_y: |
        {{ selected_xy[1] | float }}
      gauge_brightness: |
        {% if palette_temp | int == 100 %}
          190
        {% else %}
          255
        {% endif %}
      pulse_low_brightness: |
        {% if gauge_brightness | int <= 190 %}
          85
        {% else %}
          125
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ spa_enabled }}'
      - condition: template
        value_template: '{{ target_reached }}'
      - condition: state
        entity_id: input_boolean.spa_gauge_blinked
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.spa_gauge_blinked
      - repeat:
          count: 5
          sequence:
          - condition: state
            entity_id: input_boolean.home_lighting_manual_backyard
            state: 'off'
          - action: light.turn_on
            target:
              entity_id: light.backyard_spa_strip_lights
            data:
              xy_color:
              - '{{ gauge_x }}'
              - '{{ gauge_y }}'
              brightness: '{{ gauge_brightness | int }}'
              transition: 0
          - delay:
              milliseconds: 350
          - condition: state
            entity_id: input_boolean.home_lighting_manual_backyard
            state: 'off'
          - action: light.turn_off
            target:
              entity_id: light.backyard_spa_strip_lights
            data:
              transition: 0
          - delay:
              milliseconds: 250
      - condition: state
        entity_id: input_boolean.home_lighting_manual_backyard
        state: 'off'
      - action: light.turn_on
        target:
          entity_id: light.backyard_spa_strip_lights
        data:
          xy_color:
          - '{{ gauge_x }}'
          - '{{ gauge_y }}'
          brightness: '{{ gauge_brightness | int }}'
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ spa_enabled }}'
      - condition: template
        value_template: '{{ target_reached }}'
      sequence:
      - condition: state
        entity_id: input_boolean.home_lighting_manual_backyard
        state: 'off'
      - action: light.turn_on
        target:
          entity_id: light.backyard_spa_strip_lights
        data:
          xy_color:
          - '{{ gauge_x }}'
          - '{{ gauge_y }}'
          brightness: '{{ gauge_brightness | int }}'
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ spa_enabled }}'
      - condition: template
        value_template: '{{ heater_active }}'
      - condition: template
        value_template: '{{ not target_reached }}'
      sequence:
      - repeat:
          while:
          - condition: state
            entity_id: input_boolean.spa_gauge_active
            state: 'on'
          - condition: state
            entity_id: binary_sensor.hue_bridge_backyard
            state: 'off'
          - condition: state
            entity_id: climate.poolos_native_intellicenter_hot_tub_thermostat
            state: heat
          - condition: template
            value_template: |
              {{
                state_attr(
                  'climate.poolos_native_intellicenter_hot_tub_thermostat',
                  'hvac_action'
                ) == 'heating'
              }}
          - condition: template
            value_template: |
              {{
                state_attr(
                  'climate.poolos_native_intellicenter_hot_tub_thermostat',
                  'current_temperature'
                ) | float(80)
                <
                state_attr(
                  'climate.poolos_native_intellicenter_hot_tub_thermostat',
                  'temperature'
                ) | float(100)
              }}
          sequence:
          - condition: state
            entity_id: input_boolean.home_lighting_manual_backyard
            state: 'off'
          - action: light.turn_on
            target:
              entity_id: light.backyard_spa_strip_lights
            data:
              xy_color:
              - '{{ gauge_x }}'
              - '{{ gauge_y }}'
              brightness: '{{ pulse_low_brightness | int }}'
              transition: 2.5
          - delay:
              seconds: 2
          - delay:
              milliseconds: 300
          - condition: state
            entity_id: input_boolean.home_lighting_manual_backyard
            state: 'off'
          - action: light.turn_on
            target:
              entity_id: light.backyard_spa_strip_lights
            data:
              xy_color:
              - '{{ gauge_x }}'
              - '{{ gauge_y }}'
              brightness: '{{ gauge_brightness | int }}'
              transition: 2.5
          - delay:
              seconds: 2
          - delay:
              milliseconds: 300
    - conditions:
      - condition: template
        value_template: '{{ spa_enabled }}'
      sequence:
      - condition: state
        entity_id: input_boolean.home_lighting_manual_backyard
        state: 'off'
      - action: light.turn_on
        target:
          entity_id: light.backyard_spa_strip_lights
        data:
          xy_color:
          - '{{ gauge_x }}'
          - '{{ gauge_y }}'
          brightness: '{{ gauge_brightness | int }}'
          transition: 2
  mode: restart
