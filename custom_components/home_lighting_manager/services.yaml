reset_ownership:
  name: Reset HLM Ownership
  description: >-
    Clear resettable homeowner Manual/Manual-OFF ownership and homeowner-caused
    session suppressions, invalidate pending group-OFF interaction state, and
    begin a fresh observation epoch without commanding any lights.

mark_command_consequence:
  name: Mark HLM command consequence
  target: {}
  description: >-
    Internal attribution handshake used by the legacy renderer to identify exact
    managed leaves that are about to receive an HA-owned lighting command.
  fields:
    entity_ids:
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    guard_entity:
      required: true
      selector:
        entity:
          domain: input_boolean
    operation:
      required: true
      selector:
        select:
          options:
            - "appearance"
            - "off"

track_command_consequence:
  name: Track command consequence
  description: >-
    Internal metadata-only receipt lifecycle. Does not dispatch lighting commands
    or create ownership. Pair with the matching legacy cabinet executor.
  fields:
    receipt_id:
      required: true
      selector:
        text:
    phase:
      required: true
      selector:
        select:
          options:
            - prepare
            - submitted
            - complete
            - cancel
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    expected:
      description: Native commanded fields, required for prepare only.
      selector:
        object:
    context_id:
      description: Dispatch context identity, required for prepare only.
      selector:
        text:
